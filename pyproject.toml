[project]
name = "investor-os"
version = "0.1.0"
description = "Evidence-driven AI investment research and decision-support platform"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2,<3",
    "google-genai>=1,<2",
    "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[tool.pytest.ini_options]
markers = [
    "integration: tests that call external services",
]